# Vérification manuelle contre le vrai stockage Dell ECS de Cloud Temple.
#
# État de départ, mesuré avant d'écrire ce fichier : le seul test marqué
# `real_s3` était collecté par la CI par défaut et y skippait systématiquement,
# faute de `RUN_REAL_S3=1`. La couche censée valider la compatibilité avec le
# vrai endpoint n'avait donc jamais rien validé, et un skip est vert.
#
# Ce n'est pas un oubli. `tests/README.md` écrit que le câblage à un runner
# GitHub est volontairement absent, parce que le seau de test porte une
# politique d'accès par liste blanche d'adresses IP et que les runners hébergés
# ont des adresses publiques changeantes. L'échec attendu est `AccessDenied`.
#
# Ce workflow existe quand même, pour deux raisons.
#
# La première : cette liste blanche n'a jamais été éprouvée, puisque le test
# n'a jamais tourné. Un lancement depuis un runner hébergé la mesure. Il
# échoue en `AccessDenied` et la raison écrite est confirmée, ou il passe et
# elle tombe. Dans les deux cas on sait, au lieu de reconduire une hypothèse.
#
# La seconde : le jour où un runner auto-hébergé à IP fixe existe, il n'y aura
# qu'à changer `runs-on`, l'entrée `executant` est là pour ça.
#
# Par défaut, seules les épreuves d'écriture conditionnelle tournent. Elles
# n'écrivent que sous un préfixe `_sonde/<uuid>/` qu'elles suppriment ensuite.
# `test_real_s3_tokenstore.py` en est exclu : il écrit sur la vraie clé
# `_system/tokens.json`, la sauvegarde et la restaure, et ce code n'a encore
# jamais été exécuté. L'entrée `selection` permet de l'inclure une fois qu'un
# premier lancement aura établi que l'accès au seau fonctionne.
#
# Déclenchement manuel uniquement. L'environnement `nightly-real-s3` exige une
# approbation humaine à chaque exécution : une planification nocturne
# produirait une demande en attente toutes les nuits, que personne ne
# traiterait. Un rendez-vous que l'on ignore vaut moins que pas de rendez-vous.
name: Real S3 (Dell ECS)

on:
  workflow_dispatch:
    inputs:
      ecrivains:
        description: "Écrivains concurrents de l'épreuve d'atomicité"
        required: false
        default: "8"
      rondes:
        description: "Rondes de l'épreuve d'atomicité"
        required: false
        default: "25"
      executant:
        description: "Étiquette du runner. Passer à un runner auto-hébergé à IP fixe si la liste blanche du seau bloque les runners GitHub."
        required: false
        default: "ubuntu-latest"
      selection:
        description: "Chemin pytest à lancer. Par défaut les seules épreuves d'écriture conditionnelle, qui n'écrivent que sous _sonde/. Passer `tests` pour y ajouter test_real_s3_tokenstore.py, qui écrit sur la vraie clé _system/tokens.json et la restaure."
        required: false
        default: "tests/integration/test_ecriture_conditionnelle_ecs.py"

permissions:
  contents: read

jobs:
  real-s3:
    name: Tests contre le vrai stockage
    runs-on: ${{ inputs.executant || 'ubuntu-latest' }}
    environment: nightly-real-s3
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r boilerplate/requirements.lock
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-timeout==2.4.0

      - name: Run real S3 tests
        env:
          RUN_REAL_S3: "1"
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION_NAME: ${{ secrets.S3_REGION_NAME }}
          SONDE_ECRIVAINS: ${{ inputs.ecrivains }}
          SONDE_RONDES: ${{ inputs.rondes }}
          # Passée par l'environnement et pas interpolée dans la commande :
          # une entrée de `workflow_dispatch` écrite directement dans un `run`
          # est une injection de commande.
          SELECTION: ${{ inputs.selection }}
        run: |
          python -m pytest "${SELECTION:-tests/integration/test_ecriture_conditionnelle_ecs.py}" \
            -q -m real_s3 -rs -rw --junitxml=rapport-real-s3.xml

      # Un secret absent fait skipper les tests, et un skip est vert : la panne
      # silencieuse que ce workflow vient corriger se réinstallerait ici.
      #
      # Cette étape lit le rapport de l'exécution ci-dessus au lieu de relancer
      # pytest. Une relance coûterait de vraies écritures dans le seau, ne
      # recevrait pas les paramètres du déclenchement, et surtout son code de
      # sortie serait perdu : compter des lignes « SKIPPED » dans une sortie ne
      # dit rien d'une exécution qui a échoué sans en produire aucune.
      - name: Verify something actually ran
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          rapport = Path("rapport-real-s3.xml")
          if not rapport.exists():
              print("::error::aucun rapport produit, pytest n'a pas démarré")
              sys.exit(1)

          racine = ET.parse(rapport).getroot()
          suites = racine.findall("testsuite") or [racine]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skips = sum(int(s.get("skipped", 0)) for s in suites)
          echecs = sum(int(s.get("failures", 0)) for s in suites)
          erreurs = sum(int(s.get("errors", 0)) for s in suites)
          print(f"real_s3 : {total} tests, {skips} skippés, "
                f"{echecs} échecs, {erreurs} erreurs")

          probleme = False
          if total == 0:
              print("::error::aucun test real_s3 n'a été collecté")
              probleme = True
          if skips:
              print("::error::des tests real_s3 ont skippé, les secrets de "
                    "l'environnement sont incomplets")
              probleme = True
          if echecs or erreurs:
              print("::error::des tests real_s3 ont échoué")
              probleme = True
          sys.exit(1 if probleme else 0)
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-real-s3
          path: rapport-real-s3.xml
          if-no-files-found: warn
