name: Nightly real S3

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:17 UTC.
    - cron: '17 3 * * *'

jobs:
  real-s3-tokenstore:
    runs-on: ubuntu-latest
    environment: nightly-real-s3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r boilerplate/requirements.txt pytest pytest-asyncio
      - name: Run real S3 TokenStore tests
        env:
          RUN_REAL_S3: '1'
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION_NAME: ${{ secrets.S3_REGION_NAME }}
        run: |
          python -m pytest tests/integration/test_real_s3_tokenstore.py -q -m real_s3
