# Contrôle de conformité du corpus de règles agentiques.
#
# À copier dans .github/workflows/ du dépôt consommateur. Le vérificateur est
# vendoré avec le corpus, sous AGENTIC_RULES/ : le contrôle ne demande aucun
# accès sortant et son empreinte est elle-même couverte par la provenance.
name: Conformité des règles agentiques

# Le job hebdomadaire `check --remote` prévu par le gabarit est retiré ici :
# Cloud-Temple/agentic-rules est privé et un runner n'a aucune authentification
# vers lui, donc ce cron serait rouge à chaque exécution. Un garde qui promet un
# contrôle qu'il ne peut pas réaliser ne vaut rien. Voir l'issue #34.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle local
        run: ./AGENTIC_RULES/agentic-rules.sh check .
