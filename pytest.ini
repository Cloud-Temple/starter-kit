[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Aucun test ne doit pouvoir pendre la CI. Un interblocage sur le fil qui
# exécute pytest ne peut pas être borné depuis un fichier de test : le fil
# bloqué est celui qui devrait constater la panne. Cas réel, `_serialise`
# prend `_lock`, la mutation appelle `load()`, qui le reprend ; avec un verrou
# non réentrant, `store.create(...)` se bloque contre lui-même. Sans cette
# borne, le défaut GitHub Actions de six heures s'applique, par job.
#
# `thread` et non `signal` : mesuré, SIGALRM n'interrompt pas un `acquire()`
# bloqué ici, alors que la méthode `thread` imprime la pile de tous les fils
# puis quitte. Le délai est large devant le test le plus lent (les bornes des
# tests de course attendent jusqu'à 10 s) : c'est un garde-fou, pas un budget
# de performance.
timeout = 60
timeout_method = thread
markers =
    e2e: docker-compose end-to-end tests
    real_s3: tests requiring real Cloud Temple / Dell ECS S3 credentials
    live_vault: tests requiring a live MCP Vault and dedicated test secret
