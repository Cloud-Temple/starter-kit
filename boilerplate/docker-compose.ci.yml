# docker-compose.ci.yml — CI stack with a Moto-backed S3 TokenStore.
#
# Purpose:
#   - secretless PR/push e2e
#   - validates functional S3TokenStore behavior with _system/tokens.json
#   - does NOT replace nightly/manual tests against real Cloud Temple S3 / Dell ECS

services:
  moto:
    image: starter-kit-moto-s3:5.2.3
    build: ../tests/fixtures/s3
    expose:
      - "5000"
    ports:
      # Loopback only: lets the E2E test verify the persisted object directly.
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - mcp-net

  moto-init:
    image: starter-kit-moto-s3:5.2.3
    build: ../tests/fixtures/s3
    depends_on:
      moto:
        condition: service_healthy
    entrypoint: ["python", "-c"]
    command:
      - |
        import boto3
        from botocore.config import Config
        client = boto3.client(
            "s3",
            endpoint_url="http://moto:5000",
            aws_access_key_id="ci-access-key",
            aws_secret_access_key="ci-secret-key",
            config=Config(region_name="fr1", signature_version="s3"),
        )
        client.create_bucket(Bucket="starterkit-ci")
    networks:
      - mcp-net

  mon-mcp:
    build: .
    expose:
      - "8002"
    environment:
      MCP_SERVER_NAME: starter-kit-ci
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8002
      MCP_ALLOWED_HOSTS: '["localhost:8082"]'
      MCP_ALLOWED_ORIGINS: '["http://localhost:8082"]'
      ADMIN_BOOTSTRAP_KEY: test-ci-bootstrap-key
      S3_ENDPOINT_URL: http://moto:5000
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_BUCKET_NAME: starterkit-ci
      S3_REGION_NAME: fr1
    depends_on:
      moto-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8002/health'); assert r.status_code==200"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - mcp-net

  waf:
    build: ./waf
    ports:
      - "8082:8082"
    volumes:
      - ./waf/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      SITE_ADDRESS: :8082
    depends_on:
      mon-mcp:
        condition: service_healthy
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge
