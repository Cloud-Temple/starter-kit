listen_addresses = '*'
port = 5432
ssl = on
ssl_cert_file = '/run/pg-server/current/server.crt'
ssl_key_file = '/run/pg-server/current/server.key'
ssl_ca_file = '/run/pg-server/ca.crt'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'
fsync = on
synchronous_commit = on
log_statement = 'none'
log_min_error_statement = 'panic'
max_connections = 30
